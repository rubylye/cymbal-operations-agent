sources:
  operations-db:
    kind: bigtable
    project: ${GOOGLE_CLOUD_PROJECT}
    instance: ${BIGTABLE_INSTANCE:-operations-db}

tools:
  read_cashier_realtime_alerts_sql:
    description: "Executes declarative GoogleSQL over Bigtable instance operations-db to retrieve live 1-hour rolling cashier override metrics, promo abuse anomalies, and audit flags."
    source: operations-db
    parameters:
      - name: store_id
        type: string
        description: "Standardized store identifier (e.g., STORE_048)"
      - name: cashier_id
        type: string
        description: "Standardized cashier identifier (e.g., CASH_1190)"
    statement: "SELECT * FROM `pos_cashier_alerts` WHERE _key LIKE CONCAT(@store_id, '#', @cashier_id, '#%') ORDER BY _key DESC LIMIT 1"

  read_pos_transactions_enriched_sql:
    description: "Executes declarative GoogleSQL over Bigtable instance operations-db to query enriched sub-second POS checkout transactions."
    source: operations-db
    parameters:
      - name: store_id
        type: string
        description: "Store identifier (e.g., STORE_048)"
      - name: transaction_id
        type: string
        description: "Transaction identifier (e.g., TXN-99881)"
      - name: limit_count
        type: integer
        description: "Maximum transaction records to retrieve (default: 10)"
    statement: "SELECT * FROM `pos_transactions_enriched` WHERE _key LIKE CONCAT(@store_id, '#', @transaction_id, '#%') LIMIT @limit_count"
